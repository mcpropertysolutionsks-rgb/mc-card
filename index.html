<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Property Solutions</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #050505, #111827);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card-container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .card-image {
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      transition: transform 0.3s ease;
    }

    .card-image:hover {
      transform: scale(1.02);
    }

    .buttons {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .btn {
      text-decoration: none;
      background: #d4af37;
      color: black;
      padding: 14px;
      border-radius: 14px;
      font-weight: bold;
      transition: 0.3s ease;
      display: block;
    }

    .btn:hover {
      background: #f5d76e;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="card-container">
    <img src="card.png" alt="MC Property Solutions Card" class="card-image" />

    <div class="buttons">
      <a class="btn" href="tel:9132834002">📞 Call Now</a>

      <a class="btn" href="mailto:mcpropertysolutions.ks@gmail.com">
        ✉️ Send Email
      </a>

      <a class="btn" href="https://mcproperty-solutions.vercel.app" target="_blank">
        🌐 Visit Website
      </a>

      <a class="btn" href="https://share.google/mG58IX0jNb8LcXyPC" target="_blank">
        ⭐ Google Profile
      </a>
    </div>
  </div>

</body>
</html>
