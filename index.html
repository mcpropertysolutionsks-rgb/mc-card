<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCPS Invoice System v11</title></head><body><div style="font-family:Arial,sans-serif;padding:24px">Loading MCPS Invoice System v11…</div><script>(async()=>{try{const urls=[1,2,3,4,5].map(n=>`/v11/part${n}.txt?v=11.1`);const parts=[];for(const u of urls){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u}: ${r.status}`);parts.push(await r.text())}document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:monospace;padding:20px">MCPS Invoice v11 could not load: '+String(e)+'</pre>'}})();</script></body></html>
